  en: "Crypto Majors Trend Pullback (Long-Only)"
  zh: "主流币趋势回调做多"
  zh-tw: "主流幣趨勢回調做多"
  es: "Retroceso en tendencia de criptomonedas principales (solo largos)"
  ja: "主要暗号資産トレンド押し目買い（ロングのみ）"
