# Nautilus replay spec. Instrument rules mirror the live Bitget USDT-FUTURES
# contract config pulled on 2026-10-09 (tick, size step, min size, VIP0 fees).
# The starting balance is deliberately large so venue margin never binds; the
# strategy enforces its own notional cap (margin_budget x leverage) and all
# user-facing returns are expressed against strategy_config.margin_budget.
venue:
  name: BITGET
  account_type: MARGIN
  oms_type: NETTING
  starting_balances:
    - amount: 100000
      currency: USDT

strategy:
  module: strategy
  class: TrendPullbackStrategy
  config_class: TrendPullbackConfig
  config:
    order_id_tag: "001"

instruments:
  - id: BTCUSDT.BITGET
    kind: perpetual
    raw_symbol: BTCUSDT
    base_currency: BTC
    quote_currency: USDT
    settlement_currency: USDT
    price_precision: 1
    size_precision: 4
    price_increment: "0.1"
    size_increment: "0.0001"
    lot_size: "0.0001"
    maker_fee: "0.0002"
    taker_fee: "0.0006"
    bar_type: BTCUSDT.BITGET-1-HOUR-LAST-EXTERNAL
  - id: ETHUSDT.BITGET
    kind: perpetual
    raw_symbol: ETHUSDT
    base_currency: ETH
    quote_currency: USDT
    settlement_currency: USDT
    price_precision: 2
    size_precision: 2
    price_increment: "0.01"
    size_increment: "0.01"
    lot_size: "0.01"
    maker_fee: "0.0002"
    taker_fee: "0.0006"
    bar_type: ETHUSDT.BITGET-1-HOUR-LAST-EXTERNAL
  - id: SOLUSDT.BITGET
    kind: perpetual
    raw_symbol: SOLUSDT
    base_currency: SOL
    quote_currency: USDT
    settlement_currency: USDT
    price_precision: 3
    size_precision: 1
    price_increment: "0.001"
    size_increment: "0.1"
    lot_size: "0.1"
    maker_fee: "0.0002"
    taker_fee: "0.0006"
    bar_type: SOLUSDT.BITGET-1-HOUR-LAST-EXTERNAL

data_requirements:
  required_bar_fields:
    - ema_fast
    - ema_slow
    - atr
    - adx
    - plus_di
    - minus_di
    - atr_pct_rank
