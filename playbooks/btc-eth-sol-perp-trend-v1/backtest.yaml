# Nautilus replay spec. Fee rates are the Bitget USDT-FUTURES public contract
# config values returned by /api/v2/mix/market/contracts on 2026-10-09
# (makerFeeRate 0.0002, takerFeeRate 0.0006). Price/size increments come from
# pricePlace / volumePlace / minTradeNum of the same response.
venue:
  name: BITGET
  account_type: MARGIN
  oms_type: NETTING
  starting_balances:
    - amount: 100000
      currency: USDT

strategy:
  module: strategy
  class: PerpTrendStrategy
  config_class: PerpTrendStrategyConfig
  config:
    order_id_tag: "perp-trend-v1"
    params_json: "{}"
    first_bar_open_ns: 0
    write_outputs: true

instruments:
  - id: BTCUSDT.BITGET
    kind: perpetual
    raw_symbol: BTCUSDT
    base_currency: BTC
    quote_currency: USDT
    settlement_currency: USDT
    price_precision: 1
    size_precision: 4
    price_increment: "0.1"
    size_increment: "0.0001"
    lot_size: "0.0001"
    maker_fee: "0.0002"
    taker_fee: "0.0006"
    bar_type: BTCUSDT.BITGET-1-HOUR-LAST-EXTERNAL
  - id: ETHUSDT.BITGET
    kind: perpetual
    raw_symbol: ETHUSDT
    base_currency: ETH
    quote_currency: USDT
    settlement_currency: USDT
    price_precision: 2
    size_precision: 2
    price_increment: "0.01"
    size_increment: "0.01"
    lot_size: "0.01"
    maker_fee: "0.0002"
    taker_fee: "0.0006"
    bar_type: ETHUSDT.BITGET-1-HOUR-LAST-EXTERNAL
  - id: SOLUSDT.BITGET
    kind: perpetual
    raw_symbol: SOLUSDT
    base_currency: SOL
    quote_currency: USDT
    settlement_currency: USDT
    price_precision: 3
    size_precision: 1
    price_increment: "0.001"
    size_increment: "0.1"
    lot_size: "0.1"
    maker_fee: "0.0002"
    taker_fee: "0.0006"
    bar_type: SOLUSDT.BITGET-1-HOUR-LAST-EXTERNAL

# No execution.start/end: the replay covers every fetched bar; the strategy
# itself only becomes trade-eligible after the indicator warm-up, and
# main_backtest.py reports the effective eligible window.

data_requirements:
  required_bar_fields:
    - funding_rate
