venue:
  name: BINANCE
  account_type: MARGIN
  oms_type: NETTING
  starting_balances:
    - amount: 100000
      currency: USDT

strategy:
  module: strategy
  class: UsdtmTrendStrategy
  config_class: UsdtmTrendStrategyConfig
  config:
    order_id_tag: "001"
    ema_fast: 20
    ema_slow: 50
    adx_period: 14
    adx_threshold: 20.0
    atr_period: 14
    atr_stop_mult: 1.5
    atr_min_rank: 0.10
    volume_lookback: 20
    volume_mult: 1.5
    tp_r_mult: 2.0
    risk_per_trade_usdt: 15.0
    max_positions: 3
    time_stop_bars: 8
    daily_pause_usdt: -30.0
    daily_stop_usdt: -40.0
    max_consec_losses: 5

execution:
  start: "2023-10-01T00:00:00Z"
  end: "2025-10-01T00:00:00Z"

instruments:
  - id: BTCUSDT.BINANCE
    kind: perpetual
    raw_symbol: BTCUSDT
    base_currency: BTC
    quote_currency: USDT
    settlement_currency: USDT
    price_precision: 1
    size_precision: 4
    price_increment: "0.1"
    size_increment: "0.0001"
    lot_size: "0.0001"
    maker_fee: "0.0002"
    taker_fee: "0.0006"
    bar_type: BTCUSDT.BINANCE-1-HOUR-LAST-EXTERNAL
  - id: ETHUSDT.BINANCE
    kind: perpetual
    raw_symbol: ETHUSDT
    base_currency: ETH
    quote_currency: USDT
    settlement_currency: USDT
    price_precision: 2
    size_precision: 2
    price_increment: "0.01"
    size_increment: "0.01"
    lot_size: "0.01"
    maker_fee: "0.0002"
    taker_fee: "0.0006"
    bar_type: ETHUSDT.BINANCE-1-HOUR-LAST-EXTERNAL
  - id: SOLUSDT.BINANCE
    kind: perpetual
    raw_symbol: SOLUSDT
    base_currency: SOL
    quote_currency: USDT
    settlement_currency: USDT
    price_precision: 3
    size_precision: 1
    price_increment: "0.001"
    size_increment: "0.1"
    lot_size: "0.1"
    maker_fee: "0.0002"
    taker_fee: "0.0006"
    bar_type: SOLUSDT.BINANCE-1-HOUR-LAST-EXTERNAL
