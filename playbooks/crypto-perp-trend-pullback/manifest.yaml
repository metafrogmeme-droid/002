  en: "Crypto Majors Trend Pullback (BTC/ETH/SOL Perps, Long-Only)"
  zh: "主流币趋势回调做多（BTC/ETH/SOL 永续）"
  zh-tw: "主流幣趨勢回調做多（BTC/ETH/SOL 永續）"
  es: "Retroceso en tendencia de criptos principales (perpetuos BTC/ETH/SOL, solo largos)"
  ja: "主要暗号資産トレンド押し目買い（BTC/ETH/SOL 無期限、ロングのみ）"
  vi: "Mua hồi trong xu hướng tiền mã hóa chính (hợp đồng vĩnh cửu BTC/ETH/SOL, chỉ Long)"
description: "Long-only, fixed-risk trend-pullback limit entries on BTC, ETH and SOL USDT perpetuals with attached stop and fixed target"
description_i18n:
  en: "Long-only, fixed-risk trend-pullback limit entries on BTC, ETH and SOL USDT perpetuals with attached stop and fixed target"
  zh: "BTC、ETH、SOL USDT 永续合约只做多的固定风险趋势回调限价入场，附带止损与固定止盈"
  zh-tw: "BTC、ETH、SOL USDT 永續合約只做多的固定風險趨勢回調限價進場，附帶停損與固定停利"
