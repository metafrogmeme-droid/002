venue:
  name: BITGET
  account_type: MARGIN
  oms_type: NETTING
  starting_balances:
    - amount: 10000
      currency: USDT

strategy:
  module: strategy
  class: EmaAdxTrendStrategy
  config_class: EmaAdxTrendStrategyConfig
  config:
    order_id_tag: "101"
    fast_ema_period: 20
    slow_ema_period: 50
    adx_period: 14
    adx_minimum: 25.0
    atr_period: 14
    atr_percentile_lookback: 252
    atr_percentile_minimum: 20.0
    atr_percentile_maximum: 80.0
    volume_average_period: 20
    volume_multiplier: 1.5
    stop_atr_multiplier: 1.5
    take_profit_r: 2.0
    risk_usdt: 15.0
    time_stop_bars: 8
    entry_cancel_bars: 4
    max_concurrent_positions: 3
    daily_entry_pause_usdt: 30.0
    daily_stop_usdt: 40.0
    consecutive_loss_halt: 5
    slippage_ticks: 1

instruments:
  - id: BTCUSDT.BITGET
    kind: perpetual
    raw_symbol: BTCUSDT
    base_currency: BTC
    quote_currency: USDT
    settlement_currency: USDT
    price_precision: 1
    size_precision: 4
    price_increment: "0.1"
    size_increment: "0.0001"
    lot_size: "0.0001"
    maker_fee: "0.0002"
    taker_fee: "0.0006"
    bar_type: BTCUSDT.BITGET-1-HOUR-LAST-EXTERNAL
  - id: ETHUSDT.BITGET
    kind: perpetual
    raw_symbol: ETHUSDT
    base_currency: ETH
    quote_currency: USDT
    settlement_currency: USDT
    price_precision: 2
    size_precision: 2
    price_increment: "0.01"
    size_increment: "0.01"
    lot_size: "0.01"
    maker_fee: "0.0002"
    taker_fee: "0.0006"
    bar_type: ETHUSDT.BITGET-1-HOUR-LAST-EXTERNAL
  - id: SOLUSDT.BITGET
    kind: perpetual
    raw_symbol: SOLUSDT
    base_currency: SOL
    quote_currency: USDT
    settlement_currency: USDT
    price_precision: 3
    size_precision: 1
    price_increment: "0.001"
    size_increment: "0.1"
    lot_size: "0.1"
    maker_fee: "0.0002"
    taker_fee: "0.0006"
    bar_type: SOLUSDT.BITGET-1-HOUR-LAST-EXTERNAL

execution:
  start: "2024-09-01T00:00:00Z"
