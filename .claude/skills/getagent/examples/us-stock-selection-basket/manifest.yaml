long_description: |
  This Playbook is a non-trading selection basket for Bitget RWA US stock spot
  markets. It is designed to test the callout product path rather than to
  automate trading. The thesis is that a compact basket of liquid, familiar
  large-cap equity tokens is useful for validating how the platform stores,
  refreshes, and displays watchlist recommendations. Each run ranks a fixed
  candidate universe by a simple quality-growth preference and emits the top
  candidates as structured basket rows.

  Entry is a research publication event, not an order event. When the Playbook
  runs, it selects names that combine durable franchise quality, broad investor
  attention, and clear thematic exposure. The output is a managed watch signal
  whose metadata contains the selected assets, reference prices, targets, stop
  levels, thesis text, and risk text. Subscribers should read the basket as a
  current shortlist for review, not as an instruction to open positions.

  Exit is replacement by the next completed run. There is no position lifecycle,
  no close order, and no stop execution inside this package. A later run may
  publish a different basket, revise the risk notes, or remove a name when its
  relative rank weakens. The previous basket remains useful as historical
  context for product breadth statistics, but it is not managed like an open
  trade.

  Subscribers may tune the maximum number of assets included in the basket.
  A smaller setting makes the output more selective, while a larger setting
  keeps more of the same ranked universe visible. This parameter changes the
  display breadth only; it does not change sizing, leverage, order behavior, or
  account risk because the package never places trades.

  The Playbook underperforms as a decision aid when broad equity sentiment
  changes faster than a scheduled watchlist can refresh, when RWA token
  liquidity is thin, or when single-name news overwhelms the simple ranking.
  The prices in this test package are illustrative fixtures for platform QA,
  not live quotes or performance promises. Treat the emitted basket as a
  structured test artifact and research prompt that still requires independent
  judgment before any separate trading decision.

