long_description: |
  This Playbook is a non-trading callout basket that demonstrates how to publish
  a daily watchlist instead of an auto-trading strategy. It is designed for
  subscribers who want a compact list of assets to inspect, not a set of orders
  to follow. The package emits a managed signal whose metadata contains today's
  basket, and the platform stores that basket for product display.

  The entry concept is a watchlist refresh. On each scheduled run, the Playbook
  selects a small number of liquid crypto assets and explains why each asset is
  worth monitoring. It does not open positions and does not ask the runtime to
  place orders. The signal action stays at watch so users can consume the basket
  as research context.

  The exit concept is simply replacement by the next run. A future scheduled
  execution may emit a different basket or a different risk note, and the
  product surface will show the latest completed snapshot. There is no trade
  lifecycle, no position close, and no stop execution because this package is a
  callout product rather than a follow-trade product.

  Subscribers may tune the maximum number of assets included in the demo basket.
  Lower values make the watchlist more selective, while higher values give a
  broader sample of the same fixed candidate set. The parameter changes display
  breadth only; it does not change trade sizing or order behavior because the
  package never trades.

  This demo underperforms as a trading system because it is intentionally not a
  trading system. The reference and target prices are illustrative demo values,
  not live market quotes or performance promises. Real callout Playbooks should
  fetch current context through documented getagent.data endpoints, explain the
  basis of each pick, and clearly state that basket inclusion is not a guarantee
  of future return. Treat the emitted basket as a structured research note:
  useful for discovery and comparison, but always requiring human review before
  any separate trading decision.

market_type: spot
