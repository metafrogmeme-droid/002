instrument:
  id: BTCUSDT.BINANCE
  kind: perpetual
  raw_symbol: BTCUSDT
  base_currency: BTC
  quote_currency: USDT
  settlement_currency: USDT
  price_precision: 2
  size_precision: 4
  price_increment: "0.10"
  size_increment: "0.0001"
  lot_size: "0.0001"
  maker_fee: "0.0002"
  taker_fee: "0.0006"
  bar_type: BTCUSDT.BINANCE-1-HOUR-LAST-EXTERNAL
