venue:
  name: BINANCE
  account_type: MARGIN
  oms_type: NETTING
  starting_balances:
    - amount: 100000
      currency: USDT

strategy:
  module: strategy
  class: CryptoPerpsRegimeStrategy
  config_class: CryptoPerpsRegimeStrategyConfig
  config:
    order_id_tag: "001"
    trade_size: "0.01"
    adx_period: 14
    atr_period: 14
    adx_threshold: 25.0
    risk_usdt: 15.0
