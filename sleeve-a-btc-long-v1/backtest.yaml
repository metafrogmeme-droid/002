  account_type: MARGIN
  oms_type: NETTING
  starting_balances:
    - amount: 100000
      currency: USDT

strategy:
  module: strategy
  class: BtcLongAtrStrategy
  config_class: BtcLongAtrStrategyConfig
  config:
    order_id_tag: "001"
    trade_size: "0.01"
    ema_fast: 20
    ema_slow: 50
    adx_period: 14
    adx_threshold: 20
    atr_period: 14
    atr_mult: 1.5
