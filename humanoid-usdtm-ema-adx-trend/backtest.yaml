venue:
  name: BITGET
  account_type: MARGIN
  oms_type: NETTING
  starting_balances:
    - amount: 10000
      currency: USDT

strategy:
  module: strategy
  class: EmaAdxTrendStrategy
  config_class: EmaAdxTrendStrategyConfig
  config:
    order_id_tag: "001"
    fast_period: 12
    slow_period: 26
    adx_period: 14
    adx_min: 25
    atr_period: 14
    atr_percentile_lookback: 500
    atr_pct_lo: 20
    atr_pct_hi: 90
    volume_avg_period: 20
    volume_mult: 1.5
    volume_confirm_bars: 4
    risk_usdt: "15"
    stop_atr_mult: 1.5
    first_tp_r: 1.5
    first_tp_fraction: 0.5
    trail_atr_mult: 1.0
    time_stop_hours: 8
    limit_ttl_hours: 4
    max_concurrent: 3
    maker_fee: 0.0002
    taker_fee: 0.0006
    slippage_ticks: 1

execution:
  start: "2024-10-09T00:00:00Z"
  end: "2026-10-09T17:00:00Z"

instruments:
  - id: BTCUSDT.BITGET
    kind: perpetual
    raw_symbol: BTCUSDT
    base_currency: BTC
    quote_currency: USDT
    settlement_currency: USDT
    price_precision: 1
    size_precision: 4
    price_increment: "0.1"
    size_increment: "0.0001"
    lot_size: "0.0001"
    maker_fee: "0.0002"
    taker_fee: "0.0006"
    bar_type: BTCUSDT.BITGET-1-HOUR-LAST-EXTERNAL
  - id: ETHUSDT.BITGET
    kind: perpetual
    raw_symbol: ETHUSDT
    base_currency: ETH
    quote_currency: USDT
    settlement_currency: USDT
    price_precision: 2
    size_precision: 2
    price_increment: "0.01"
    size_increment: "0.01"
    lot_size: "0.01"
    maker_fee: "0.0002"
    taker_fee: "0.0006"
    bar_type: ETHUSDT.BITGET-1-HOUR-LAST-EXTERNAL
  - id: SOLUSDT.BITGET
    kind: perpetual
    raw_symbol: SOLUSDT
    base_currency: SOL
    quote_currency: USDT
    settlement_currency: USDT
    price_precision: 3
    size_precision: 1
    price_increment: "0.001"
    size_increment: "0.1"
    lot_size: "0.1"
    maker_fee: "0.0002"
    taker_fee: "0.0006"
    bar_type: SOLUSDT.BITGET-1-HOUR-LAST-EXTERNAL
